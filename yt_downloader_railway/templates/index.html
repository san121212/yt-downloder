<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1080p YouTube Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="header">
        <span class="badge">1080p MP4 • Multi-Audio</span>
        <h1>YouTube Downloader</h1>
        <p class="subtitle">Choose Original, Hindi (Dubbed), or English and download fast.</p>
      </div>

      <form id="dlForm">
        <label for="urlInput">YouTube URL</label>
        <input
          type="url"
          id="urlInput"
          name="url"
          placeholder="https://youtu.be/... or https://www.youtube.com/watch?v=..."
          required
          autocomplete="off"
        />

        <label>Audio Language</label>
        <div class="lang-grid">
          <label class="lang-card">
            <input type="radio" name="language" value="original" checked />
            <span>Original</span>
          </label>
          <label class="lang-card">
            <input type="radio" name="language" value="hi" />
            <span>Hindi</span>
          </label>
          <label class="lang-card">
            <input type="radio" name="language" value="en" />
            <span>English</span>
          </label>
        </div>

        <button type="submit" id="dlBtn">Fast Download 1080p</button>
      </form>

      <div id="progressBox" class="progress-box hidden">
        <div class="progress-meta">
          <span id="statusText">Preparing...</span>
          <span id="percentText">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div id="errorBox" class="error-box hidden"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("dlForm");
    const dlBtn = document.getElementById("dlBtn");
    const progressBox = document.getElementById("progressBox");
    const progressFill = document.getElementById("progressFill");
    const percentText = document.getElementById("percentText");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");

    let pollTimer = null;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function triggerBrowserDownload(jobId) {
      const link = document.createElement("a");
      link.href = `/file/${encodeURIComponent(jobId)}`;
      link.setAttribute("download", "");
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function pollJob(jobId) {
      try {
        const res = await fetch(`/status/${encodeURIComponent(jobId)}`);
        const data = await res.json();

        if (!res.ok || data.state === "error") {
          clearInterval(pollTimer);
          progressBox.classList.add("hidden");
          showError(data.message || data.error || "Download failed.");
          dlBtn.disabled = false;
          dlBtn.textContent = "Fast Download 1080p";
          return;
        }

        const pct = Number(data.percent || 0);
        progressFill.style.width = `${pct}%`;
        percentText.textContent = `${pct.toFixed(0)}%`;
        statusText.textContent = data.message || "Processing...";

        if (data.state === "completed") {
          clearInterval(pollTimer);
          progressFill.style.width = "100%";
          percentText.textContent = "100%";
          statusText.textContent = "Download started on your device!";
          triggerBrowserDownload(jobId);

          setTimeout(() => {
            dlBtn.disabled = false;
            dlBtn.textContent = "Fast Download 1080p";
          }, 1500);
        }
      } catch (err) {
        clearInterval(pollTimer);
        progressBox.classList.add("hidden");
        showError("Connection error while checking progress.");
        dlBtn.disabled = false;
        dlBtn.textContent = "Fast Download 1080p";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      if (pollTimer) clearInterval(pollTimer);

      const url = document.getElementById("urlInput").value.trim();
      const language = document.querySelector('input[name="language"]:checked').value;

      dlBtn.disabled = true;
      dlBtn.textContent = "Starting...";
      progressBox.classList.remove("hidden");
      progressFill.style.width = "2%";
      percentText.textContent = "2%";
      statusText.textContent = "Queueing download...";

      try {
        const res = await fetch("/start-download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, language }),
        });
        const data = await res.json();

        if (!res.ok || !data.job_id) {
          throw new Error(data.error || "Failed to start download.");
        }

        pollTimer = setInterval(() => pollJob(data.job_id), 900);
        pollJob(data.job_id);
      } catch (err) {
        progressBox.classList.add("hidden");
        showError(err.message);
        dlBtn.disabled = false;
        dlBtn.textContent = "Fast Download 1080p";
      }
    });
  </script>
</body>
</html>
